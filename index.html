<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Задачи | To-Do List</title>
    <style>
        /* --- 1. CSS СТИЛИ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            /* Оранжевый градиент, как в твоем портфолио */
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: #fff;
            margin: 100px auto 20px;
            padding: 40px 30px 70px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #002765;
            flex: 1;
        }

        .header img {
            width: 30px;
            margin-left: 10px;
        }

        /* Поле ввода и кнопка */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #edeef0;
            border-radius: 30px;
            padding-left: 20px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 10px;
            font-size: 16px;
        }

        button {
            border: none;
            outline: none;
            padding: 16px 50px;
            background: #ff5945;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #e04835;
        }

        /* Список задач */
        ul li {
            list-style: none;
            font-size: 17px;
            padding: 12px 8px 12px 50px;
            user-select: none;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        ul li:hover {
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        /* Кружочек (не выполненная задача) */
        ul li::before {
            content: '';
            position: absolute;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background-image: url(https://cdn-icons-png.flaticon.com/512/481/481078.png); /* Пустой круг */
            background-size: cover;
            background-position: center;
            top: 8px;
            left: 8px;
        }

        /* Выполненная задача (класс checked) */
        ul li.checked {
            color: #555;
            text-decoration: line-through;
        }

        ul li.checked::before {
            background-image: url(https://cdn-icons-png.flaticon.com/512/190/190411.png); /* Галочка */
        }

        /* Крестик (Удалить) */
        ul li span {
            position: absolute;
            right: 0;
            top: 5px;
            width: 40px;
            height: 40px;
            font-size: 22px;
            color: #555;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
        }

        ul li span:hover {
            background: #edeef0;
            color: #ff5945;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Мои Задачи</h2>
            <img src="https://cdn-icons-png.flaticon.com/512/4697/4697260.png" alt="icon">
        </div>

        <div class="row">
            <input type="text" id="input-box" placeholder="Что нужно сделать?">
            <button onclick="addTask()">Добавить</button>
        </div>

        <ul id="list-container">
            </ul>
    </div>

    <script>
        const inputBox = document.getElementById("input-box");
        const listContainer = document.getElementById("list-container");

        // 1. Функция добавления задачи
        function addTask() {
            if(inputBox.value === '') {
                alert("Вы должны что-то написать!");
            } else {
                let li = document.createElement("li");
                li.innerHTML = inputBox.value;
                listContainer.appendChild(li);
                
                // Создаем крестик для удаления
                let span = document.createElement("span");
                span.innerHTML = "\u00d7"; // Символ крестика
                li.appendChild(span);
            }
            inputBox.value = ""; // Очистить поле
            saveData(); // Сохранить в память
        }

        // 2. Обработка кликов (Сделать выполнено или Удалить)
        listContainer.addEventListener("click", function(e) {
            if(e.target.tagName === "LI") {
                e.target.classList.toggle("checked"); // Зачеркнуть
                saveData();
            }
            else if(e.target.tagName === "SPAN") {
                e.target.parentElement.remove(); // Удалить
                saveData();
            }
        }, false);

        // 3. Сохранение в LocalStorage (Браузер запомнит список)
        function saveData() {
            localStorage.setItem("data", listContainer.innerHTML);
        }

        // 4. Загрузка из памяти при открытии сайта
        function showTask() {
            listContainer.innerHTML = localStorage.getItem("data");
        }
        
        // Запускаем при старте
        showTask(); 

        // Добавим возможность жать Enter вместо клика по кнопке
        inputBox.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>

</body>
</html>
